# /etc/keepalived/keepalived.conf（priority をノードごとに 150/100/50 などに変える）
# VRRP の認証（PASS）は平文なので、相手をユニキャストで固定し、FW で VRRP（プロトコル112）をノード同士に限る
global_defs {
  enable_script_security
  script_user keepalived_script
}
vrrp_script chk_haproxy {
  script "/usr/bin/killall -0 haproxy"
  interval 2
  fall 2
  rise 2
}
vrrp_instance SKERERU_VIP {
  state BACKUP
  interface eth0
  virtual_router_id 51
  priority 150
  advert_int 1
  nopreempt
  unicast_src_ip 10.0.0.11
  unicast_peer {
    10.0.0.12
    10.0.0.13
  }
  authentication {
    auth_type PASS
    auth_pass change-me
  }
  virtual_ipaddress {
    10.0.0.10/24
  }
  track_script {
    chk_haproxy
  }
}
