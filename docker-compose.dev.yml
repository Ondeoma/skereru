# 開発用: PostgreSQL + PGroonga（本番は Patroni）と、
# Mailpit（外への送信を受け止めるだけの SMTP。http://localhost:8032 で中身を見られる。RELAY_HOST で中継先にする）
# ほかの兄弟プロジェクトの開発環境と同時に動かせるよう、ポートをずらしている
name: skereru
services:
  db:
    image: groonga/pgroonga:4.1.0-alpine-17-slim
    environment:
      POSTGRES_USER: skereru
      POSTGRES_PASSWORD: skereru
      POSTGRES_DB: skereru
    ports: ["127.0.0.1:54370:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/dev-initdb.sql:/docker-entrypoint-initdb.d/10-skereru-test.sql:ro   # テスト用DB skereru_test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skereru"]
      interval: 2s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1032:1025", "127.0.0.1:8032:8025"]
volumes:
  pgdata:
