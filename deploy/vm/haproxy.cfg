# /etc/haproxy/haproxy.cfg（3台とも同じ）。VIP(10.0.0.10) は keepalived が持つ。MX・メールソフトはこの VIP に向ける。
# HTTPS はここで終端する。メールは TCP のまま渡し（STARTTLS はアプリが行う）、PROXY プロトコル v2 で本当の接続元を伝える。
global
  log /dev/log local0
  maxconn 20000
defaults
  log global
  timeout connect 3s
  timeout client 30m
  timeout server 30m
  default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions

frontend https
  mode http
  option httplog
  timeout client 60s
  bind :443 ssl crt /etc/haproxy/certs/mail.example.com.pem alpn h2,http/1.1
  bind :80
  http-request redirect scheme https unless { ssl_fc } || { path_beg /.well-known/acme-challenge/ }
  http-request set-header X-Forwarded-Proto https
  default_backend web
backend web
  mode http
  option forwardfor
  balance roundrobin
  timeout server 60s
  option httpchk GET /healthz
  http-check expect status 200
  server skereru1 10.0.0.11:8080 check
  server skereru2 10.0.0.12:8080 check
  server skereru3 10.0.0.13:8080 check

# メール: 公開のポート → アプリの高いポート
frontend smtp
  mode tcp
  bind :25
  default_backend smtp
backend smtp
  mode tcp
  balance leastconn
  option httpchk GET /healthz
  server skereru1 10.0.0.11:2525 check port 8080 send-proxy-v2
  server skereru2 10.0.0.12:2525 check port 8080 send-proxy-v2
  server skereru3 10.0.0.13:2525 check port 8080 send-proxy-v2
