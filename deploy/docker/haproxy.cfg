# 入口: 3台のアプリへ振り分ける。アプリはステートレス（セッションも DB）なので、振り分けは単純でよい。
# メール（SMTP・IMAP・POP3）は TCP のまま渡し、PROXY プロトコル v2 で本当の接続元を伝える（迷惑メールの判定・総当たり対策に必要）。
global
  log stdout format raw local0
# コンテナを作り直すと IP が変わるので、Docker の DNS で解決し直す
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s
defaults
  log global
  timeout connect 3s
  timeout client 30m          # IMAP の IDLE
  timeout server 30m
  timeout client-fin 5s
  default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none

frontend http
  mode http
  option httplog
  timeout client 60s
  bind :8080
  default_backend apps
backend apps
  mode http
  option forwardfor
  balance roundrobin
  timeout server 60s
  option httpchk GET /healthz
  http-check expect status 200
  server app1 app1:8080 check
  server app2 app2:8080 check
  server app3 app3:8080 check

# メールのポートごとの入口（ヘルスチェックは HTTP の /healthz で行う。DB のプライマリに書けないノードには送らない）
frontend smtp
  mode tcp
  bind :2525
  default_backend smtp
backend smtp
  mode tcp
  balance leastconn
  option httpchk GET /healthz
  server app1 app1:2525 check port 8080 send-proxy-v2
  server app2 app2:2525 check port 8080 send-proxy-v2
  server app3 app3:2525 check port 8080 send-proxy-v2
